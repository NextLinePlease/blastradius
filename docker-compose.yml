version: '3.8'

# YAML Anchors: This is a DRY technique. It defines a template block.
# We inject this template into every service so we don't repeat the build context 6 times.
x-service-base: &service-base
  build:
    context: ./service
  networks:
    - blast-net

services:
  service-f:
    <<: *service-base
    container_name: service-f
    environment:
      - SERVICE_NAME=service-f

  service-e:
    <<: *service-base
    container_name: service-e
    environment:
      - SERVICE_NAME=service-e

  service-d:
    <<: *service-base
    container_name: service-d
    environment:
      - SERVICE_NAME=service-d

  service-c:
    <<: *service-base
    container_name: service-c
    environment:
      - SERVICE_NAME=service-c
      - DOWNSTREAM_URLS=http://service-e:8000,http://service-f:8000

  service-b:
    <<: *service-base
    container_name: service-b
    environment:
      - SERVICE_NAME=service-b
      - DOWNSTREAM_URLS=http://service-d:8000

  service-a:
    <<: *service-base
    container_name: service-a
    # We only expose the entrypoint (Gateway) to your host machine.
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=service-a
      - DOWNSTREAM_URLS=http://service-b:8000,http://service-c:8000

networks:
  blast-net:
    driver: bridge