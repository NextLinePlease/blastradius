version: '3.8'

x-service-base: &service-base
  build:
    context: ./service
  networks:
    - blast-net

services:
  # --- NEW: The PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    container_name: blast-postgres
    environment:
      POSTGRES_USER: blastuser
      POSTGRES_PASSWORD: blastpass
      POSTGRES_DB: blastradius
    ports:
      - "5432:5432"
    volumes:
      # This ensures database data survives container restarts
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blastuser -d blastradius"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- NEW: The Registry Service ---
  registry:
    build:
      context: ./registry
    container_name: blast-registry
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://blastuser:blastpass@postgres:5432/blastradius
    networks:
      - blast-net
    depends_on:
      postgres:
        condition: service_healthy

  # --- EXISTING: The Worker Fleet ---
  service-f:
    <<: *service-base
    container_name: service-f
    environment:
      - SERVICE_NAME=service-f

  service-e:
    <<: *service-base
    container_name: service-e
    environment:
      - SERVICE_NAME=service-e

  service-d:
    <<: *service-base
    container_name: service-d
    environment:
      - SERVICE_NAME=service-d

  service-c:
    <<: *service-base
    container_name: service-c
    environment:
      - SERVICE_NAME=service-c
      - DOWNSTREAM_URLS=http://service-e:8000,http://service-f:8000

  service-b:
    <<: *service-base
    container_name: service-b
    environment:
      - SERVICE_NAME=service-b
      - DOWNSTREAM_URLS=http://service-d:8000

  service-a:
    <<: *service-base
    container_name: service-a
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=service-a
      - DOWNSTREAM_URLS=http://service-b:8000,http://service-c:8000

networks:
  blast-net:
    driver: bridge

# Declare the persistent volume for Postgres
volumes:
  postgres_data: